name: Release

# 触发规则（省额度）：只在推送 v* 标签时编译一次，发布一个正式 Release；
# 平时提交代码不会触发任何构建。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来生成两个标签之间的更新日志

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::缺少仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/textrelay.keystore
          printf 'storePassword=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TextRelay-${VERSION}.apk"
          echo "APK=dist/TextRelay-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release notes
        run: |
          CUR="$GITHUB_REF_NAME"
          PREV=$(git tag --sort=-creatordate | grep -v '^latest$' | sed -n '2p')
          {
            echo "## 更新内容"
            if [ -n "$PREV" ]; then
              git log --no-decorate --pretty=format:"- %s (%h)" "$PREV..$CUR"
              echo ""
              echo ""
              echo "**完整变更**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${CUR}"
            else
              git log --no-decorate --pretty=format:"- %s (%h)" "$CUR" | head -30
            fi
            echo ""
            echo "---"
            echo "版本：versionName ${VERSION} · 签名与历史版本一致，可直接覆盖安装（versionCode 未变时需先卸载）。"
          } > release_notes.md
          cat release_notes.md

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "TextRelay $GITHUB_REF_NAME" \
            --notes-file release_notes.md
