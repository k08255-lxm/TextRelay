name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::缺少仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/textrelay.keystore
          printf 'storePassword=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TextRelay-${VERSION}.apk"
          echo "APK=dist/TextRelay-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # main 分支代码更新：自动重建 latest 预发布，下载入口永远固定
      - name: Update "latest" pre-release
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null \
            || git push origin ":refs/tags/latest" 2>/dev/null || true
          gh release create latest "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "最新构建 · ${SHA7}" \
            --notes "main 分支自动构建（versionName ${VERSION}）。签名与正式发布一致，可直接覆盖安装旧版本。"

      # 推送 v* 标签：发布正式版本
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "TextRelay $GITHUB_REF_NAME" \
            --notes "自动构建的正式发布（versionName ${VERSION}）。签名与历史版本一致，可直接覆盖升级；versionCode 未变时需先卸载。"
