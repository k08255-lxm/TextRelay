name: Release

# 发版规则（省额度）：
# 1) 本地编译发版（推荐，零编译额度）：本地构建后创建「草稿 Release」并附上 APK，
#    再推送代码 —— CI 发现草稿后直接发布，跳过编译：
#      gh release create vX.Y.Z --draft --target HEAD --title "..." --notes "..." 本地apk路径
# 2) 没有草稿时，CI 自动编译并发布正式 Release（versionName 必须是新版本号）。
# 3) versionName 对应的标签已存在 → 跳过。

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force:
        description: '版本号已存在时强制重新发布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide release mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null \
              || git push origin ":refs/tags/$TAG" 2>/dev/null || true
            echo "MODE=build" >> "$GITHUB_ENV"
          elif git tag -l "$TAG" | grep -q .; then
            echo "MODE=skip" >> "$GITHUB_ENV"
            echo "版本 $TAG 已发布过，跳过"
          elif gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "MODE=publish" >> "$GITHUB_ENV"
            echo "发现本地编译的草稿 Release $TAG，将直接发布（跳过编译）"
          else
            echo "MODE=build" >> "$GITHUB_ENV"
            echo "版本 $TAG 未发布且无草稿，将云端编译发布"
          fi

      - uses: actions/setup-java@v4
        if: env.MODE == 'build'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing keystore from secrets
        if: env.MODE == 'build'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::缺少仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/textrelay.keystore
          printf 'storePassword=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" > keystore.properties

      - name: Build release APK
        if: env.MODE == 'build'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        if: env.MODE == 'build'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TextRelay-${VERSION}.apk"
          echo "APK=dist/TextRelay-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Build release notes
        if: env.MODE == 'build'
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v '^latest$' | sed -n '1p')
          {
            echo "## 更新内容"
            if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
              git log --no-decorate --pretty=format:"- %s (%h)" "$PREV..$GITHUB_SHA"
              echo ""
              echo ""
              echo "**完整变更**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --no-decorate --pretty=format:"- %s (%h)" "$GITHUB_SHA" | head -30
            fi
            echo ""
            echo "---"
            echo "版本：versionName ${VERSION} · 签名与历史版本一致，可直接覆盖安装。"
          } > release_notes.md
          cat release_notes.md

      - name: Create release (云端编译)
        if: env.MODE == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "TextRelay $TAG" \
            --notes-file release_notes.md

      - name: Publish draft release (本地编译)
        if: env.MODE == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          echo "已直接发布本地编译的 $TAG（未占用 Actions 编译资源）"
