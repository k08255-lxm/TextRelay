name: Build (latest)

# 仅在 APP 相关代码变更时编译并刷新 latest 预发布；
# 改 pc/、README、文档等不会触发编译。

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-latest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::缺少仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/textrelay.keystore
          printf 'storePassword=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TextRelay-${VERSION}.apk"
          echo "APK=dist/TextRelay-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null \
            || git push origin ":refs/tags/latest" 2>/dev/null || true
          gh release create latest "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "最新构建 · ${SHA7}" \
            --notes "main 分支自动构建（versionName ${VERSION}）。签名与正式发布一致，可直接覆盖安装旧版本。"
