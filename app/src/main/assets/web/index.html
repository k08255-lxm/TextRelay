<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字互传</title>
<style>
:root{
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --bg:#F7F2FA; --card:#FFFFFF; --text:#1D1B20; --muted:#5F5966;
  --primary:#6750A4; --on-primary:#FFFFFF; --primary-soft:#EADDFF; --on-primary-soft:#21005D;
  --own:#EADDFF; --on-own:#21005D; --border:#E3DDEA; --danger:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131316; --card:#1E1B22; --text:#E6E1E9; --muted:#9F94A8;
    --primary:#CFBCFF; --on-primary:#381E72; --primary-soft:#4A4458; --on-primary-soft:#EADDFF;
    --own:#3B3244; --on-own:#EADDFF; --border:#2C2930; --danger:#F2B8B5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}

/* ── 顶栏：半透明材料，内容从下方滚过 ── */
header{position:sticky;top:0;z-index:10;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--border)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:12px}
.bar h1{font-size:18px;font-weight:650;letter-spacing:-0.01em;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  font-size:12px;color:var(--muted);border:1px solid var(--border);
  border-radius:999px;padding:3px 10px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#9E9E9E;flex-shrink:0}
.chip .dot.ok{background:#43A047}
.chip .dot.warn{background:#FB8C00}

/* ── 按钮：按压反馈 + 悬停态 ── */
button{font:inherit;cursor:pointer;border:none;border-radius:999px;background:none;color:var(--primary);
  padding:8px 14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;
  transition:transform 160ms var(--ease-out),background-color 160ms var(--ease-out),opacity 160ms var(--ease-out)}
button:active{transform:scale(0.97)}
button:disabled{opacity:.38;cursor:default;transform:none}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button svg{width:16px;height:16px;flex-shrink:0}
.btn-filled{background:var(--primary);color:var(--on-primary);font-weight:550}
.btn-tonal{background:var(--primary-soft);color:var(--on-primary-soft)}
.btn-text{padding:8px 10px}
.btn-danger-text{color:var(--danger)}
@media (hover:hover) and (pointer:fine){
  .btn-filled:hover{filter:brightness(1.08)}
  .btn-tonal:hover{filter:brightness(1.04)}
  .btn-text:hover,.btn-danger-text:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
}

main{max-width:760px;margin:0 auto;padding:16px 16px 64px}

/* ── 输入区 ── */
.composer{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;
  margin-bottom:20px}
textarea{width:100%;min-height:64px;max-height:240px;resize:none;border:none;outline:none;
  background:transparent;color:var(--text);font:inherit;line-height:1.6;display:block}
.composer .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* ── 列表头（清空入口常驻）── */
.listhead{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.listhead .label{font-size:12px;color:var(--muted)}
#clearall{color:var(--danger);padding:6px 10px}
#clearall:disabled{color:var(--muted)}

/* ── 消息卡 ── */
.msg{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
.msg.enter{opacity:0;transform:translateY(8px)}
.msg .head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:var(--primary-soft);color:var(--on-primary-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;line-height:1}
.msg.own .avatar{background:var(--own);color:var(--on-own)}
.who{font-weight:600;font-size:13.5px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted);flex-shrink:0}
.msg pre{margin:2px 0 0;white-space:pre-wrap;word-break:break-word;font:inherit}
.msg.own{background:var(--own);border-color:transparent}
.msg.own pre,.msg.own .who{color:var(--on-own)}
.msg.own .time{color:var(--on-own);opacity:.65}
.act{display:flex;justify-content:flex-end;gap:2px;margin-top:6px;margin-bottom:-6px}
.act button{padding:5px 10px;font-size:12.5px;color:var(--muted);border-radius:8px}
.act button:hover{color:var(--text);background:color-mix(in srgb,var(--text) 8%,transparent)}
.pend{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px;flex-shrink:0}
.avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:var(--primary-soft);color:var(--on-primary-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;line-height:1}
.msg.own .avatar{background:transparent;border:1px solid var(--border);color:var(--muted)}
@media (hover:hover) and (pointer:fine){
  .act{opacity:0;transition:opacity 150ms var(--ease-out)}
  .msg:hover .act{opacity:1}
}

#empty{text-align:center;color:var(--muted);margin-top:72px;line-height:2}
#empty svg{width:40px;height:40px;opacity:.5;display:block;margin:0 auto 8px}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:30px;z-index:50;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);
  padding:9px 18px;border-radius:999px;font-size:13.5px;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out)}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ── 确认弹窗 ── */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.42);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity 180ms var(--ease-out)}
#scrim[hidden]{display:none}
#scrim.open{opacity:1;pointer-events:auto}
#scrim .dialog{background:var(--card);border-radius:20px;padding:20px 22px 14px;max-width:340px;width:100%;
  transform:scale(0.96);opacity:0;transition:transform 180ms var(--ease-out),opacity 180ms var(--ease-out)}
#scrim.open .dialog{transform:scale(1);opacity:1}
#scrim h3{margin:0 0 8px;font-size:16.5px;font-weight:650}
#scrim p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
#scrim .dialog-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
#okclear{color:var(--danger);font-weight:550}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:1ms !important;animation:none !important}
  .msg.enter{opacity:1;transform:none}
}
.device-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 18px;margin-bottom:18px}
.device-panel summary{cursor:pointer;font-weight:600}
.device-panel h3{font-size:14px;margin:18px 0 8px}
.device-panel form,.device-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.device-panel input{min-width:0;flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.device-panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}
.device-panel dt,.keyboard-hint{color:var(--muted)}
.device-panel dd{margin:0;overflow-wrap:anywhere}
.device-line span{flex:1;overflow-wrap:anywhere}
.keyboard-hint{font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>文字互传</h1>
    <span class="chip" id="dev"><span class="dot" id="devdot"></span><span id="devtext">…</span></span>
    <button id="clearall" class="btn-text" title="清空全部记录" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      清空记录
    </button>
  </div>
</header>
<main>
  <details class="device-panel" open>
    <summary>设备与连接 · <span id="self-name">本机</span></summary>
    <dl><dt>本机 IP</dt><dd id="self-ips">读取中…</dd><dt>同步端口</dt><dd id="self-port">—</dd><dt>网页地址</dt><dd id="self-web"></dd></dl>
    <div id="pc-settings" hidden>
      <form id="name-form"><label for="device-name">设备名称</label><input id="device-name" maxlength="64" required><button type="submit" class="btn-tonal">保存名称</button></form>
      <h3>附近设备</h3><div id="peer-list"></div>
      <h3>手动连接</h3>
      <form id="peer-form"><input id="peer-ip" aria-label="对方 IP" placeholder="对方 IP，如 192.168.1.100" required><input id="peer-port" aria-label="同步端口" type="number" min="1" max="65535" value="24680" style="max-width:100px"><button type="submit" class="btn-tonal">添加设备</button></form>
      <div id="manual-list"></div>
    </div>
  </details>
  <div class="composer">
    <textarea id="input" placeholder="输入要发送的文字，局域网内打开应用的设备都会收到"></textarea>
    <div class="keyboard-hint">Enter 发送 · Ctrl+Enter 换行</div>
    <div class="row">
      <button id="paste" class="btn-tonal">粘贴</button>
      <button id="clear" class="btn-text">清空</button>
      <button id="send" class="btn-filled" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        发送
      </button>
    </div>
  </div>
  <div class="listhead" id="listhead" hidden>
    <span class="label" id="countlabel"></span>
  </div>
  <div id="list"></div>
  <div id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    还没有消息<br>发送后，所有在线设备都会收到；设备离线时保存在本机
  </div>
</main>
<div id="toast" role="status"></div>
<div id="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h3>清空全部记录？</h3>
    <p>清空将同步到所有设备，离线设备重新连接后生效。此操作不可撤销。</p>
    <div class="dialog-actions">
      <button class="btn-text" id="cancelclear">取消</button>
      <button id="okclear" class="btn-text">清空</button>
    </div>
  </div>
</div>
<script>
const list=document.getElementById('list'),empty=document.getElementById('empty'),
      input=document.getElementById('input'),sendBtn=document.getElementById('send'),
      devText=document.getElementById('devtext'),devDot=document.getElementById('devdot'),
      clearAllBtn=document.getElementById('clearall'),countLabel=document.getElementById('countlabel'),
      toastEl=document.getElementById('toast'),scrim=document.getElementById('scrim');
let msgs=[],seen=new Set(),lastTs=0,dirty=false,myId=null,lastRev=null;

input.addEventListener('input',()=>{grow();sendBtn.disabled=!input.value.trim();});
function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,240)+'px';}
input.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){input.setRangeText('\n',input.selectionStart,input.selectionEnd,'end');input.dispatchEvent(new Event('input'));}
  else if(!sendBtn.disabled){sendBtn.click();}
});

/* ── Toast 反馈：每个动作都有回应 ── */
let toastTimer=null;
function toast(t){
  toastEl.textContent=t; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2400);
}

/* ── 确认弹窗 ── */
let onConfirmOk=null;
function openConfirm(ok){onConfirmOk=ok;scrim.hidden=false;requestAnimationFrame(()=>scrim.classList.add('open'));}
function closeConfirm(){scrim.classList.remove('open');setTimeout(()=>{scrim.hidden=true;},190);}
scrim.addEventListener('click',e=>{if(e.target===scrim)closeConfirm();});
document.getElementById('cancelclear').addEventListener('click',closeConfirm);
document.getElementById('okclear').addEventListener('click',()=>{closeConfirm();if(onConfirmOk)onConfirmOk();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!scrim.hidden)closeConfirm();});

sendBtn.addEventListener('click',async()=>{
  const t=input.value.trim(); if(!t)return;
  input.value=''; grow(); sendBtn.disabled=true;
  try{
    const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
    let j=null; try{ j=await r.json(); }catch(err){}
    if(!r.ok){ toast('发送失败（'+r.status+'）'); input.value=t; grow(); sendBtn.disabled=false; }
    else if(j&&j.queued&&j.message){
      const m=j.message;
      if(!seen.has(m.id)){ seen.add(m.id); msgs.push({...m, pending:true}); msgs.sort((a,b)=>a.ts-b.ts); newIds.add(m.id); dirty=true; render(); }
      toast('已暂存，手机上线后自动送达');
    }
    else if(j&&j.delivered>0){ toast('已发送 · 送达 '+j.delivered+' 台设备'); }
    else { toast('已保存 · 其他设备上线后自动接收'); }
    await poll();
  }catch(err){ toast('发送失败：'+err); input.value=t; grow(); sendBtn.disabled=false; }
});
document.getElementById('paste').addEventListener('click',async()=>{
  try{ input.value=await navigator.clipboard.readText(); input.dispatchEvent(new Event('input')); }
  catch(e){ input.focus(); toast('请用 Ctrl+V 粘贴'); }
});
document.getElementById('clear').addEventListener('click',()=>{ input.value=''; grow(); sendBtn.disabled=true; input.focus(); });

function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t); return; }
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(ts){
  const d=new Date(ts),n=new Date(),p=x=>(x<10?'0':'')+x;
  const sameDay=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  return (sameDay?'':(d.getMonth()+1)+'-'+d.getDate()+' ')+p(d.getHours())+':'+p(d.getMinutes());
}
const newIds=new Set();
function render(){
  const changed=dirty; dirty=false;
  clearAllBtn.disabled=msgs.length===0;
  countLabel.textContent=msgs.length?('共 '+msgs.length+' 条'):'';
  list.innerHTML=msgs.map(m=>{
    const who=(myId&&m.sid===myId)?'我':esc(m.name);
    const initial=who.slice(0,1).toUpperCase();
    return `<div class="msg${m.sid===myId?' own':''}${newIds.has(m.id)?' enter':''}">`+
      `<div class="head"><span class="avatar">${esc(initial)}</span>`+
      `<span class="who">${esc(who)}</span>${m.pending?'<span class="pend">待送达</span>':''}<span class="time">${fmt(m.ts)}</span></div>`+
      `<pre>${esc(m.text)}</pre>`+
      `<div class="act"><button data-id="${m.id}" title="复制">`+
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>复制</button>`+
      `<button data-del="${m.id}" title="删除">`+
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>`+
      `</div></div>`;}).join('');
  empty.style.display=msgs.length?'none':'block';
  if(changed&&newIds.size){ requestAnimationFrame(()=>list.querySelectorAll('.enter').forEach(el=>el.classList.remove('enter'))); }
  newIds.clear();
}
list.addEventListener('click',async e=>{
  const del=e.target.closest('button[data-del]');
  if(del){
    const id=del.dataset.del;
    if(!confirm('从所有设备删除这条文字？离线设备重新连接后也会删除。'))return;
    try{ const r=await fetch('/api/messages/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)throw Error(); }catch(err){toast('删除失败，请重试');return;}
    msgs=msgs.filter(x=>x.id!==id); seen.delete(id); dirty=true; render(); toast('已删除'); return;
  }
  const b=e.target.closest('button[data-id]'); if(!b)return;
  const m=msgs.find(x=>x.id===b.dataset.id);
  if(m){ copyText(m.text); toast('已复制到剪贴板'); }
});
/* ── 清空全部记录：确认弹窗 → 删除 → 重置状态 ── */
clearAllBtn.addEventListener('click',()=>{
  if(!msgs.length) return;
  openConfirm(async()=>{
    try{ const r=await fetch('/api/messages',{method:'DELETE'});if(!r.ok)throw Error(); }catch(err){toast('清空失败，请重试');return;}
    msgs=[]; seen.clear(); lastTs=0; lastRev=null;
    dirty=true; render(); await poll();
    toast('已清空，正在同步到所有设备');
  });
});

async function configure(path,body,method='POST'){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json();if(!r.ok)throw Error(data.error||'保存失败');return data;
}
function showSelf(info){
  document.getElementById('self-name').textContent=info.name||'本机';
  document.getElementById('self-ips').textContent=(info.ips||[]).join(' / ')||'未连接局域网';
  document.getElementById('self-port').textContent=info.port||'—';
  document.getElementById('self-web').textContent=location.origin;
}
async function refreshSelf(){const r=await fetch('/api/info');if(r.ok)showSelf(await r.json());}
document.getElementById('device-name').addEventListener('input',e=>{e.target.dataset.dirty='1';});
document.getElementById('name-form').addEventListener('submit',async e=>{
  e.preventDefault();const field=document.getElementById('device-name');
  try{await configure('/api/name',{name:field.value});delete field.dataset.dirty;await refreshStatus();toast('名称已保存，其他设备稍后更新');}catch(err){toast(err.message);}
});
document.getElementById('peer-form').addEventListener('submit',async e=>{
  e.preventDefault();const field=document.getElementById('peer-ip');
  try{await configure('/api/peers',{ip:field.value,port:Number(document.getElementById('peer-port').value)});field.value='';await refreshStatus();toast('已添加，正在连接');}catch(err){toast(err.message);}
});
/* ── 连接状态 ── */
async function refreshStatus(){
  try{
    const r=await fetch('/__relay/status');
    if(!r.ok) throw 0;
    const s=await r.json();
    myId=s.id||null;
    document.getElementById('pc-settings').hidden=false;
    document.getElementById('self-name').textContent=s.name||'本机';
    const nameInput=document.getElementById('device-name');
    if(!nameInput.dataset.dirty)nameInput.value=s.name||'';
    const peers=document.getElementById('peer-list');peers.replaceChildren();
    for(const p of s.devices||[]){const row=document.createElement('div');row.className='device-line';row.textContent=p.name+' · '+p.ip+':'+p.port+' · '+(p.online?'在线':'离线');peers.append(row);}
    if(!peers.childNodes.length)peers.textContent='还没有发现其他设备，请连接同一 Wi-Fi。';
    const manual=document.getElementById('manual-list');manual.replaceChildren();
    for(const [ip,port] of s.manualPeers||[]){
      const row=document.createElement('div');row.className='device-line';
      const label=document.createElement('span');label.textContent=ip+':'+port;
      const remove=document.createElement('button');remove.textContent='移除手动配置';
      remove.onclick=async()=>{try{await configure('/api/peers',{ip,port},'DELETE');await refreshStatus();}catch(e){toast(e.message);}};
      row.append(label,remove);manual.append(row);
    }
    await refreshSelf();
    if(s.connected){ devDot.className='dot ok'; devText.textContent=(s.onlineCount||1)+' 台设备在线 · '+s.device; }
    else{ devDot.className='dot warn'; devText.textContent='等待设备上线 · 文字保存在本机'; }
    return;
  }catch(e){ myId=null; }
  try{
    const i=await (await fetch('/api/info')).json();
    devDot.className='dot ok'; devText.textContent='来自手机：'+i.name;showSelf(i);
  }catch(e){
    devDot.className='dot warn'; devText.textContent='未连接手机';
  }
}

/* 修订号只在成功读完整列表后提交；同一时刻只允许一次刷新。 */
let polling=false;
async function poll(){
  if(polling)return;
  polling=true;
  try{
    const count=await fetch('/api/messages/count',{cache:'no-store'});
    if(!count.ok)throw Error();
    const cj=await count.json();
    if(lastRev===null||cj.rev!==lastRev){
      const r=await fetch('/api/messages?since=0',{cache:'no-store'});
      if(!r.ok)throw Error();
      const arr=await r.json();
      if(!Array.isArray(arr))throw Error();
      for(const m of arr)if(!seen.has(m.id))newIds.add(m.id);
      msgs=arr.sort((a,b)=>a.ts-b.ts);seen=new Set(msgs.map(m=>m.id));
      lastTs=msgs.length?msgs[msgs.length-1].ts:0;
      lastRev=cj.rev;dirty=true;render();
    }
  }catch(e){}finally{polling=false;}
}

setInterval(refreshStatus,3000);
setInterval(poll,1000);
refreshStatus();
poll();
</script>
