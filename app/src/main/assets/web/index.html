<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字互传</title>
<style>
:root{
  --bg:#F7F2FA; --card:#FFFFFF; --text:#1D1B20; --muted:#5F5966;
  --primary:#6750A4; --primary-text:#FFFFFF; --container:#EADDFF; --border:#E5E1E9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131316; --card:#1E1B22; --text:#E6E1E9; --muted:#9A93A3;
    --primary:#CFBCFF; --primary-text:#381E72; --container:#4A4458; --border:#2C2930;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:1;background:var(--bg);padding:14px 16px 10px;
  border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
  align-items:baseline;gap:8px}
header h1{font-size:20px;margin:0;font-weight:600}
header .sub{font-size:12px;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:12px 16px 48px}
.sendbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:16px}
#status{display:none;margin-top:8px;font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:72px;resize:vertical;border:none;outline:none;
  background:transparent;color:var(--text);font:inherit}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
button{border:none;border-radius:20px;padding:8px 16px;font:inherit;cursor:pointer;
  background:transparent;color:var(--primary)}
button.primary{background:var(--primary);color:var(--primary-text)}
button:disabled{opacity:.4;cursor:default}
.msg{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:12px 14px;margin-bottom:10px}
.msg .head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.msg .head .who{color:var(--primary);font-weight:600}
.msg pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.msg .act{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.msg .act button{padding:4px 12px;font-size:13px}
#clearall{font-size:13px;color:var(--muted)}
.listhead{display:flex;justify-content:flex-end;margin-bottom:4px}
#empty{text-align:center;color:var(--muted);margin-top:48px;line-height:1.8}
#empty code{background:var(--container);padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>文字互传</h1>
  <div class="sub" id="dev">…</div>
</header>
<main>
  <div class="sendbox">
    <textarea id="input" placeholder="输入要发送的文字，局域网内打开应用的设备都会收到"></textarea>
    <div class="row">
      <button id="paste">粘贴</button>
      <button id="clear">清空</button>
      <button id="send" class="primary" disabled>发送</button>
    </div>
    <div id="status"></div>
  </div>
  <div class="listhead"><button id="clearall">清空全部记录</button></div>
  <div id="list"></div>
  <div id="empty">还没有消息<br>发送后，所有在线设备都会收到；手机不在线时自动暂存</div>
</main>
<script>
const list=document.getElementById('list'),empty=document.getElementById('empty'),
      input=document.getElementById('input'),sendBtn=document.getElementById('send'),
      devEl=document.getElementById('dev');
let msgs=[],seen=new Set(),lastTs=0,dirty=false,myId=null,lastRev=null;

input.addEventListener('input',()=>{sendBtn.disabled=!input.value.trim();});

let statusTimer=null;
function showStatus(t){
  const el=document.getElementById('status');
  el.textContent=t; el.style.display='block';
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{el.style.display='none';},5000);
}
sendBtn.addEventListener('click',async()=>{
  const t=input.value.trim(); if(!t)return;
  input.value=''; sendBtn.disabled=true;
  try{
    const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
    let j=null; try{ j=await r.json(); }catch(e){}
    if(!r.ok){ showStatus('发送失败（'+r.status+'）'); }
    else if(j&&j.queued){ showStatus('已暂存在电脑，手机上线后自动送达'); }
    else if(j&&j.delivered>0){ showStatus('已发送 · 送达 '+j.delivered+' 台设备'); }
    else { showStatus('已保存 · 其他设备上线后自动接收'); }
    await poll();
  }catch(e){ showStatus('发送失败：'+e); }
});
document.getElementById('paste').addEventListener('click',async()=>{
  try{ input.value=await navigator.clipboard.readText(); input.dispatchEvent(new Event('input')); }
  catch(e){ input.focus(); }
});
document.getElementById('clear').addEventListener('click',()=>{ input.value=''; sendBtn.disabled=true; });

function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t); return; }
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(ts){
  const d=new Date(ts),n=new Date(),p=x=>(x<10?'0':'')+x;
  const sameDay=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  return (sameDay?'':(d.getMonth()+1)+'-'+d.getDate()+' ')+p(d.getHours())+':'+p(d.getMinutes());
}
function render(){
  if(!dirty)return; dirty=false;
  document.getElementById('clearall').disabled = msgs.length===0;
  list.innerHTML=msgs.map(m=>{
    const who=(myId&&m.sid===myId)?'我':esc(m.name);
    return `<div class="msg"><div class="head"><span class="who">${who}</span>`+
    `<span>${fmt(m.ts)}</span></div><pre>${esc(m.text)}</pre>`+
    `<div class="act"><button data-id="${m.id}">复制</button><button data-del="${m.id}">删除</button></div></div>`;}).join('');
  empty.style.display=msgs.length?'none':'block';
  window.scrollTo(0,document.body.scrollHeight);
}
list.addEventListener('click',async e=>{
  const del=e.target.closest('button[data-del]');
  if(del){
    const id=del.dataset.del;
    try{ await fetch('/api/messages/'+id,{method:'DELETE'}); }catch(err){}
    msgs=msgs.filter(x=>x.id!==id); seen.delete(id); dirty=true; render(); return;
  }
  const b=e.target.closest('button[data-id]'); if(!b)return;
  const m=msgs.find(x=>x.id===b.dataset.id);
  if(m){ copyText(m.text); b.textContent='已复制'; setTimeout(()=>b.textContent='复制',1200); }
});
document.getElementById('clearall').addEventListener('click',async()=>{
  if(!msgs.length || !confirm('确定清空全部消息记录？（仅清除保存这些消息的设备，其他设备不受影响）')) return;
  try{ await fetch('/api/messages',{method:'DELETE'}); }catch(err){}
  msgs=[]; seen.clear(); lastRev=null; dirty=true; render(); await poll();
});

/* 连接状态：经 PC 工具打开时显示是否连上手机；直接用手机 IP 打开时显示手机名 */
async function refreshStatus(){
  try{
    const r=await fetch('/__relay/status');
    if(!r.ok) throw 0;
    const s=await r.json();
    myId = s.id || null;
    devEl.textContent = s.connected ? ('已连接手机：'+s.device) : '未连接手机 · 发送将暂存，上线后自动送达';
    return;
  }catch(e){
    myId = null;
  }
  try{
    const i=await (await fetch('/api/info')).json();
    devEl.textContent='来自手机：'+i.name;
  }catch(e){
    devEl.textContent='未连接手机';
  }
}

async function fullSync(){
  try{
    const arr=await (await fetch('/api/messages?since=0')).json();
    msgs=Array.isArray(arr)?arr:[];
    seen=new Set(msgs.map(m=>m.id));
    lastTs=msgs.length?msgs[msgs.length-1].ts:0;
    dirty=true; render();
  }catch(e){}
}
async function poll(){
  // 服务端修订号变化（增删/清空）→ 全量重拉，保证手机上的删除能同步到网页
  try{
    const cj=await (await fetch('/api/messages/count')).json();
    if(typeof cj.rev==='number'){
      if(lastRev===null){ lastRev=cj.rev; }
      else if(cj.rev!==lastRev){ lastRev=cj.rev; await fullSync(); return; }
    }
  }catch(e){}
  try{
    const r=await fetch('/api/messages?since='+lastTs);
    const arr=await r.json();
    let added=false;
    for(const m of arr){
      if(!seen.has(m.id)){ seen.add(m.id); msgs.push(m); added=true; if(m.ts>lastTs)lastTs=m.ts; }
    }
    if(added){ msgs.sort((a,b)=>a.ts-b.ts); dirty=true; }
  }catch(e){}
  render();
}
setInterval(refreshStatus,3000);
setInterval(poll,2000);
refreshStatus();
poll();
</script>
</body>
</html>
